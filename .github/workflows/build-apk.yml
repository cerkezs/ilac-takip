name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IlacTakip-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Create GitHub Release with direct APK download
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "İlaç Takip v1.0.0 (Hazır APK)"
        draft: false
        prerelease: false
        generate_release_notes: false
        body: |
          ## 💊 İlaç Takip Uygulaması (Android)
          
          Telefonunuza doğrudan kurmak için aşağıdaki **Assets** bölümünden **`.apk`** dosyasını indirin.
          
          ### 🕒 Hatırlatma Saatleri:
          - **Kardoritm** $\rightarrow$ 10:00 (Sabah • Aç veya tok)
          - **Ecoprin Pro** $\rightarrow$ 19:00 (Akşam • Aç karnına)
          - **Plavix** $\rightarrow$ 20:00 (Akşam • Tok karnına)
          
          *Telefon kilitliyken tam ekran arama bildirimi ile çalar.*
        files: app/build/outputs/apk/debug/*.apk
